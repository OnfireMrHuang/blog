# === LoveIt 主题博客配置 ===

# 部署后改为你的真实域名，例如 https://www.yourdomain.com
baseURL = "https://example.org/"

# 主题
theme = "LoveIt"

# 网站标题
title = "Harry 的博客"

# 语言设置（单语言简体中文）
defaultContentLanguage = "zh-cn"
locale = "zh-CN"
languageName = "简体中文"
hasCJKLanguage = true

# 版权描述，仅用于 SEO
copyright = ""

# 是否使用 robots.txt
enableRobotsTXT = true
# 是否使用 git commit log
enableGitInfo = true
# 是否使用 emoji 代码
enableEmoji = true

# 忽略一些构建错误
ignoreErrors = ["error-remote-getjson", "error-missing-instagram-accesstoken"]

# 分页配置
[pagination]
  disableAliases = false
  pagerSize = 10
  path = "page"

# 菜单配置
[menu]
  [[menu.main]]
    weight = 1
    identifier = "posts"
    name = "所有文章"
    url = "/posts/"
  [[menu.main]]
    weight = 2
    identifier = "tags"
    name = "标签"
    url = "/tags/"
  [[menu.main]]
    weight = 3
    identifier = "categories"
    name = "分类"
    url = "/categories/"
  [[menu.main]]
    weight = 4
    identifier = "about"
    name = "关于"
    url = "/about/"

[params]
  # 网站默认主题 ["auto", "light", "dark"]
  defaultTheme = "auto"
  # 公共 git 仓库路径，仅当 enableGitInfo 为 true 时有效（部署后可填你的仓库）
  gitRepo = ""
  # 日期格式
  dateFormat = "2006-01-02"
  # 网站描述，用于 RSS, SEO, Open Graph 和 Twitter Cards
  description = "记录技术与生活"

  # 作者配置
  [params.author]
    name = "Harry Huang"
    email = ""
    link = ""

  # 页面头部导航栏配置
  [params.header]
    desktopMode = "fixed"
    mobileMode = "auto"
    [params.header.title]
      logo = ""
      name = "Harry 的博客"
      pre = "<i class='far fa-kiss-wink-heart' aria-hidden='true'></i>"
      post = ""
      typeit = false

  # 页面底部信息配置
  [params.footer]
    enable = true
    custom = ""
    hugo = true
    copyright = true
    author = true
    since = 2026
    icp = ""
    license = '<a rel="license external nofollow noopener noreffer" href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank">CC BY-NC 4.0</a>'

  # Section（所有文章）页面配置
  [params.section]
    paginate = 20
    dateFormat = "01-02"
    rss = 10

  # List（分类或标签）页面配置
  [params.list]
    paginate = 20
    dateFormat = "01-02"
    rss = 10

  # 应用图标配置
  [params.app]
    title = "Harry 的博客"
    noFavicon = false
    svgFavicon = ""
    themeColor = "#ffffff"
    iconColor = "#5bbad5"
    tileColor = "#da532c"

  # 搜索配置（使用 fuse，无需外部服务）
  [params.search]
    enable = true
    type = "fuse"
    contentLength = 4000
    placeholder = ""
    maxResultLength = 10
    snippetLength = 50
    highlightTag = "em"
    absoluteURL = false

  # 主页信息设置
  [params.home]
    rss = 10
    [params.home.profile]
      enable = true
      gravatarEmail = ""
      avatarURL = "/images/avatar.png"
      title = "Harry Huang"
      subtitle = "记录技术与生活"
      typeit = true
      social = true
      disclaimer = ""
    [params.home.posts]
      enable = true
      paginate = 6

  # 主页社交信息（填你的账号，留空则不显示）
  [params.social]
    GitHub = ""
    Zhihu = ""
    Bilibili = ""
    LeetCodeCN = ""
    Email = ""
    RSS = true

  # 文章页面全局配置
  [params.page]
    hiddenFromHomePage = false
    hiddenFromSearch = false
    twemoji = false
    lightgallery = false
    ruby = true
    fraction = true
    fontawesome = true
    linkToMarkdown = true
    rssFullText = false
    [params.page.toc]
      enable = true
      keepStatic = false
      auto = true
    [params.page.code]
      copy = true
      maxShownLines = 50
    [params.page.math]
      enable = false
      copyTex = true
      mhchem = true
    [params.page.share]
      enable = false
    # 评论系统（后续需要时再开启，此处先关闭）
    [params.page.comment]
      enable = false
    [params.page.seo]
      images = []
      [params.page.seo.publisher]
        name = "Harry Huang"

  # TypeIt 打字机动画配置
  [params.typeit]
    speed = 100
    cursorSpeed = 1000
    cursorChar = "|"
    duration = -1

  # 第三方库 CDN 设置
  [params.cdn]
    data = "jsdelivr.yml"

# Hugo 解析文档配置
[markup]
  [markup.highlight]
    anchorLineNos = false
    codeFences = true
    guessSyntax = false
    lineNos = false
    lineNumbersInTable = true
    noClasses = true
  [markup.goldmark]
    [markup.goldmark.extensions]
      definitionList = true
      footnote = true
      linkify = true
      strikethrough = true
      table = true
      taskList = true
      typographer = true
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 6

# 网站地图配置
[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

# Permalinks 配置
[permalinks]
  posts = ":contentbasename"

# 隐私配置
[privacy]
  [privacy.googleAnalytics]
  [privacy.twitter]
  [privacy.youtube]

# 输出 Markdown 格式的设置
[mediaTypes]
  [mediaTypes."text/plain"]
    suffixes = ["md"]

[outputFormats.MarkDown]
  mediaType = "text/plain"
  isPlainText = true
  isHTML = false

[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML", "MarkDown"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
